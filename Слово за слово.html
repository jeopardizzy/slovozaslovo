*{box-sizing:border-box}

.sp{justify-content:space-between}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--sage);color:#fff;border-color:var(--sage)}
.lbl{font-size:13px;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.8px}
.t{display:flex;gap:12px;align-items:flex-start;padding:14px;cursor:pointer}

.t p{margin:0 0 6px}

.ck.on{background:var(--sage)}

.err{color:#c0503a;font-size:14px;min-height:20px}
.note{font-size:13px;color:var(--mute)}
.who2{font-size:14px;color:var(--mute)}

  Object.entries(NAMES).map(([k,v])=>'<button data-u="'+k+'">'+v+'</button>').join("")+
  '</div></div><p class="note">У каждого свой логин с PIN-кодом: прогресс «обсуждено» сохраняется отдельно и восстанавливается при входе.</p>';
  $.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>pick(b.dataset.u));
}
async function pick(u){
  await S.ready;let rec=null;
  if(S.db){try{const s=await S.db.doc("users/"+u).get();if(s.exists)rec=s.data()}catch(e){}}
  if(!rec)rec=lsGet("szs_"+u);
  S.pend=u;S.rec=rec;pin("");
}
function pin(err){
  const u=S.pend,n=NAMES[u],has=!!S.rec;
  $.innerHTML='<div class="card"><div class="lbl" style="margin-top:0">'+n+'</div>'+
  '<div>'+(has?"Введи свой PIN, чтобы войти":"Придумай PIN (минимум 4 символа) для входа")+'</div>'+
  '<input id="pn" type="password" autocomplete="off" inputmode="numeric" placeholder="PIN">'+
  (has?"":'<label class="c"><input id="cs" type="checkbox"> Я согласен(на) на хранение моего прогресса (какие темы обсуждены) для резервной копии</label>')+
  '<div class="err">'+esc(err||"")+'</div><div class="row"><button id="go">'+(has?"Войти":"Создать профиль")+'</button><button class="ghost" id="bk">Назад</button></div>'+
  '<p class="note">PIN защищает от случайного входа, но это не банковская защита: не используй важные пароли.</p></div>';
  document.getElementById("bk").onclick=home;
  const go=async()=>{
    const p=document.getElementById("pn").value;
    if(p.length<4)return pin("Нужно минимум 4 символа");
    const h=await hash(u+p);
    if(has){if(S.rec.pin!==h)return pin("Неверный PIN")}
    else{if(!document.getElementById("cs").checked)return pin("Нужно согласие на сохранение прогресса");S.rec={pin:h,done:[]}}
    S.user=u;S.done=new Set(S.rec.done||[]);S.note="";await save();list();
  };
  document.getElementById("go").onclick=go;
  document.getElementById("pn").onkeydown=e=>{if(e.key==="Enter")go()};
}
async function save(){
  S.rec.done=[...S.done];const ok=lsSet("szs_"+S.user,S.rec);
  const dev=ok?"прогресс сохранён только на этом устройстве.":"прогресс НЕ сохраняется (нет ни облака, ни памяти браузера).";
  if(!S.db)S.note="⚠️ Облако недоступно (нужно открыть страницу, войдя в claude.ai): "+dev;
  else try{await S.db.doc("users/"+S.user).set(S.rec);S.note="☁️ Сохранено в облаке"}catch(e){S.note="⚠️ Облако не записало ("+((e&&e.code)||"ошибка")+"): "+dev}
}
const vis=()=>T.filter(x=>(S.cat==="Все"||x.c===S.cat)&&(!S.diff||x.d===S.diff)&&(!S.hide||!S.done.has(x.id)));
function list(){
  clearInterval(S.iv);S.cur=null;
  const v=vis(),left=T.filter(x=>!S.done.has(x.id)).length;
  $.innerHTML='<div class="row sp"><div class="who2">Привет, <b>'+NAMES[S.user]+'</b> · обсуждено '+S.done.size+' из '+T.length+'</div><button class="ghost" id="out">Выйти</button></div>'+
  (S.note?'<p class="note">'+S.note+'</p>':"")+
  '<div class="lbl">Тема</div><div class="row">'+["Все",...CATS].map(c=>'<button class="chip'+(S.cat===c?" on":"")+'" data-c="'+c+'">'+c+'</button>').join("")+'</div>'+
  '<div class="lbl">Сложность</div><div class="row">'+[0,1,2,3].map(d=>'<button class="chip'+(S.diff===d?" on":"")+'" data-d="'+d+'">'+(d?DL[d]:"Любая")+'</button>').join("")+'</div>'+
  '<div class="row" style="margin:14px 0"><button class="alt" id="rnd">🎲 Случайная тема</button><label class="c" style="margin:0"><input type="checkbox" id="hd"'+(S.hide?" checked":"")+'> скрыть обсуждённые</label></div>'+
  '<div class="note" style="margin-bottom:8px">Найдено тем: '+v.length+(left?"":" · всё обсуждено, браво!")+'</div>'+
  (v.length?v.map(x=>card(x)).join(""):'<div class="card">По этим фильтрам тем нет. Попробуй другие.</div>');
  document.getElementById("out").onclick=home;
  $.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;list()});
  $.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;list()});
  document.getElementById("hd").onchange=e=>{S.hide=e.target.checked;list()};
  document.getElementById("rnd").onclick=()=>{const p=vis().filter(x=>!S.done.has(x.id));if(!p.length){S.note="Нет необсуждённых тем по этим фильтрам.";return list()}S.note="";open_(p[Math.floor(Math.random()*p.length)].id)};
  $.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>open_(+b.dataset.o));
  $.querySelectorAll("[data-k]").forEach(b=>b.onclick=e=>{e.stopPropagation();tog(+b.dataset.k,true)});
}
function card(x){const dn=S.done.has(x.id);
  return '<div class="card t'+(dn?" done":"")+'" data-o="'+x.id+'"><div style="flex:1"><p>'+esc(x.t)+'</p><span class="tag">'+x.c+'</span><span class="tag d'+x.d+'">'+DL[x.d]+'</span>'+(x.s?'<span class="tag src">из канала</span>':"")+'</div><div class="ck'+(dn?" on":"")+'" data-k="'+x.id+'" title="Обсуждена">'+(dn?"✓":"")+'</div></div>'}
async function tog(id,re){S.done.has(id)?S.done.delete(id):S.done.add(id);await save();re?list():view()}
function open_(id){S.cur=T.find(x=>x.id===id);S.end=0;view()}
function view(){
  clearInterval(S.iv);const x=S.cur,dn=S.done.has(x.id),run=S.end>Date.now();
  $.innerHTML='<div class="card"><span class="tag">'+x.c+'</span><span class="tag d'+x.d+'">'+DL[x.d]+'</span>'+(x.s?'<span class="tag src">из канала</span>':"")+
  '<div class="big">'+esc(x.t)+'</div>'+(INFO[x.id]?'<div style="background:var(--sage2);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px"><b>ℹ️ Инфослайд</b><br>'+esc(INFO[x.id])+'</div>':"")+
  (S.end?'<div class="tm" id="tm">15:00</div>':"")+
  '<div class="row"><button class="ghost" id="bk">← К списку</button>'+
  (S.end?'<button class="ghost" id="rs">Сбросить таймер</button>':'<button class="alt" id="st">▶ Начать обсуждение (15 мин)</button>')+
  '<button class="'+(dn?"":"ghost")+'" id="dn">'+(dn?"✓ Обсуждена":"Отметить обсуждённой")+'</button></div>'+
  (S.note?'<p class="note">'+S.note+'</p>':"")+'</div>';
  document.getElementById("bk").onclick=list;
  document.getElementById("dn").onclick=()=>tog(x.id,false);
  const st=document.getElementById("st");if(st)st.onclick=()=>{S.end=Date.now()+900000;view()};
  const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{S.end=0;view()};
  if(S.end){const tick=()=>{const el=document.getElementById("tm");if(!el)return clearInterval(S.iv);const ms=S.end-Date.now();
    if(ms<=0){el.textContent="Время вышло!";el.style.fontSize="38px";clearInterval(S.iv);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}return}
    const s=Math.ceil(ms/1000);el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};tick();S.iv=setInterval(tick,250)}
}
home();
</script>
</body>
</html>
